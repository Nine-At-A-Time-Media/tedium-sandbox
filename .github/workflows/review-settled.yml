# review-settled.yml -- the go-live review status on every PR head: green
# iff Copilot's newest review is on the current head and every review
# thread is resolved (template-tools#597). tedium checks it in pr_status
# before batching, which is what the T-series acceptance cases exercise.
# Checker: the reusable workflow in the public tds-utils repo.

name: review-settled

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate
        type: number
        required: true

concurrency:
  group: review-settled-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-settled:
    # issue_comment also fires for plain issues; only PR comments matter.
    # A fork PR is skipped on the events that carry a pull_request payload:
    # its token is read-only, so the status could never be posted and
    # tedium would wait on it forever. On issue_comment the payload has no
    # head repo; the checker itself refuses a fork PR from the API's
    # isCrossRepository. Fork PRs are human-merge.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
      && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    uses: 9atatimer/tds-utils/.github/workflows/review-settled.yml@master
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    with:
      reviewers: copilot-pull-request-reviewer
      pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
